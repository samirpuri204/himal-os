source /boot/grub/config.cfg

# Himal OS: boot the default entry automatically after 10 seconds.
set timeout=10
set default=0

# Live boot
menuentry "Himal OS Live (arm64)" --hotkey=l {
	linux	/live/vmlinuz-6.12.111+deb13-arm64 boot=live components username=himal hostname=himal locales=en_US.UTF-8 keyboard-layouts=us quiet splash findiso=${iso_path}
	initrd	/live/initrd.img-6.12.111+deb13-arm64
}
menuentry "Himal OS Live (fail-safe mode)" {
	linux	/live/vmlinuz-6.12.111+deb13-arm64 boot=live components memtest noapic noapm nodma nomce nosmp nosplash vga=788
	initrd	/live/initrd.img-6.12.111+deb13-arm64
}

# You can add more entries like this
# menuentry "Alternate live boot" {
# linux /live/vmlinuz-6.12.111+deb13-arm64 boot=live components username=himal hostname=himal locales=en_US.UTF-8 keyboard-layouts=us quiet splash findiso=${iso_path} custom options here
# initrd /live/initrd.img-6.12.111+deb13-arm64
# }
# menuentry "Alternate graphical installer" {
# linux   custom options here
# initrd
# }
# menuentry "Alternate textual installer" {
# linux   custom options here
# initrd
# }

# Installer (if any)
if false; then

source	/boot/grub/install_start.cfg

submenu 'Advanced install options ...' --hotkey=a {

	source /boot/grub/theme.cfg

	source	/boot/grub/install.cfg

}
fi

submenu 'Utilities...' --hotkey=u {

	source /boot/grub/theme.cfg

	# Memtest (if any)
	if false; then
		source /boot/grub/memtest.cfg
	fi

	# Firmware setup (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi

	# Verify the checksums
	if true; then
		menuentry "Verify integrity of the boot medium" --hotkey=v {
			linux	/live/vmlinuz-6.12.111+deb13-arm64 boot=live components username=himal hostname=himal locales=en_US.UTF-8 keyboard-layouts=us   findiso=${iso_path} verify-checksums
			initrd	/live/initrd.img-6.12.111+deb13-arm64
		}
	fi
}
