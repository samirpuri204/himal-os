# Himal OS compositor - rounded corners, shadows, blur, fading.
# Build by Samir Puri
backend = "glx";
vsync = true;
mark-wmwin-focused = true;

# --- shadows: this is what gives windows the floating, macOS-like depth ---
shadow = true;
shadow-radius = 22;
shadow-opacity = 0.38;
shadow-offset-x = 0;
shadow-offset-y = 10;
shadow-exclude = [
    "class_g = 'Plank'",
    "class_g = 'Rofi'",
    "class_g = 'Conky'",
    "name = 'Notification'",
    "class_g = 'Xfce4-notifyd'",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];

# --- rounded corners everywhere ---
corner-radius = 12;
rounded-corners-exclude = [
    "class_g = 'Plank'",
    "class_g = 'Xfce4-panel'",
    "window_type = 'dock'"
];

# --- real transparency + blur behind windows ---
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = false;
blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Plank'",
    "_GTK_FRAME_EXTENTS@:c"
];

# --- smooth window animations ---
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 6;
detect-rounded-corners = true;
detect-client-opacity = true;

# --- Xfce panel should stay sharp, not blurred ---
opacity-rule = [
    "100:class_g = 'Xfce4-panel'",
    "100:class_g = 'Plank'",
    "100:window_type = 'dock'",
    "100:window_type = 'desktop'",
    "96:class_g = 'Xfce4-terminal'"
];
